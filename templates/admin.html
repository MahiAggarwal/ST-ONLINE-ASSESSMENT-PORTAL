<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 40px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .score-pill { padding: 5px 15px; border-radius: 20px; font-weight: bold; background: #dff9fb; color: #0984e3; }
        .score-high { background: #def7e5; color: #27ae60; }
        .view-btn { background: #3498db; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
        
        /* Modal (popup) styling*/
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; backdrop-filter: blur(3px); }
        .modal-content { background: white; width: 70%; max-width: 800px; margin: 5% auto; padding: 40px; border-radius: 12px; position: relative; }
        .modal-body { line-height: 1.6; color: #34495e; max-height: 60vh; overflow-y: auto; background: #f9f9f9; padding: 20px; border-radius: 8px; font-family: 'Segoe UI', sans-serif; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Detailed Assessment Results</h1>
    <table>
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Submission Time</th>
                <th>MCQ Score</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<div id="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modal-name"></h2>
        <div id="modal-body" class="modal-body"></div>
    </div>
</div>

<script>
    const submissions = []; // Injected by Python

    const tbody = document.getElementById('table-body');
    // sub is the current student's data (e.g. {name, time, score, details}).
    // index is its position in the array
    submissions.forEach((sub, index) => {
        let tr = document.createElement('tr');
        const highClass = sub.score >= 4 ? 'score-high' : '';
        tr.innerHTML = `
            <td><strong>${sub.name}</strong></td>
            <td>${sub.time}</td>
            <td><span class="score-pill ${highClass}">${sub.score} / 5</span></td>
            <td><button class="view-btn" onclick="openModal(${index})">View Full Report</button></td>
        `;
        tbody.appendChild(tr); // Adds the row to the table body so it shows up in the HTML.
    });

    function openModal(index) {
    const sub = submissions[index];
    document.getElementById('modal-name').innerText = "Report: " + sub.name;
    
    const modalBody = document.getElementById('modal-body');
    modalBody.innerHTML = ""; // Clear existing content

    // Split the 'details' string back into individual questions
    const questionBlocks = sub.details.split('||');

    questionBlocks.forEach(block => {
        const [content, submitted, correct, type] = block.split('|');
        
        let color = "black";
        if (type === "MCQ") {
            color = (submitted === correct) ? "#27ae60" : "#e74c3c"; // Green or Red
        }

        // Create the HTML structure for each question
        const div = document.createElement('div');
        div.style.marginBottom = "20px";
        div.style.padding = "10px";
        div.style.borderBottom = "1px solid #ddd";
        
        div.innerHTML = `
            <div style="font-weight:bold; color:#2c3e50;">Q: ${content}</div>
            <div style="color: ${color}; margin-top:5px;">
                <strong>SUBMITTED:</strong> ${submitted}
            </div>
            ${type === 'MCQ' ? `<div style="color:#7f8c8d; font-size:0.9em;"><strong>CORRECT:</strong> ${correct}</div>` : ""}
        `;
        
        modalBody.appendChild(div);
    });

    document.getElementById('modal-overlay').style.display = 'block';
}

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
</script>
</body>
</html>
